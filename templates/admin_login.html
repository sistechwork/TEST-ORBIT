<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Test Orbit Exam Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 25%, #e2e8f0 50%, #cbd5e1 75%, #f1f5f9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 64, 175, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 45%);
            animation: floatBubbles 25s ease-in-out infinite;
        }

        @keyframes floatBubbles {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50% { transform: translate(-20px, 20px) scale(0.95); opacity: 0.6; }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .logo-container {
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sign-in-text {
            color: #1e293b;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .admin-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .login-container {
            background: white;
            backdrop-filter: blur(20px);
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.08), 0 0 100px rgba(59, 130, 246, 0.05);
            width: 100%;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo-top {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand-logo-top img {
            height: 70px;
            width: auto;
        }

        .flash-messages {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            color: #64748b;
        }

        .checkbox-container input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 50%, #1e3a8a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .footer-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: #1e40af;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
            }
            .sign-in-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="notification-container"></div>
    <div class="login-wrapper">
        <div class="logo-container">
            <div class="logo-icon">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Test Orbit Logo">
            </div>
            <div class="sign-in-text">Admin Login</div>
            <div class="admin-badge">Admin Portal</div>
        </div>

        <div class="login-container">
            <div class="brand-logo-top">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Test Orbit Logo">
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="/admin/login" autocomplete="off">
                <input type="text" name="fake_username" style="display:none" autocomplete="off">
                <input type="password" name="fake_password" style="display:none" autocomplete="new-password">
                
                <div class="form-group">
                    <label for="username">Admin Email</label>
                    <input type="text" id="username" name="username" class="input-field" placeholder="Enter admin email" required autofocus autocomplete="off" readonly onfocus="this.removeAttribute('readonly');">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="input-field" placeholder="Enter password" required autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <button type="submit" class="btn-login">Admin Login</button>
            </form>
        </div>

        <div class="footer-text">
            <p>Not an admin? <a href="/login">User Login</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</body>
</html>
